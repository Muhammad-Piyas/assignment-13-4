<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment Four</title>
    <!--- Tailwind CSS and daisyUI CDN --->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- favicon -->
    <link
      rel="shortcut icon"
      href="image/android-chrome-512x512.png"
      type="image/x-icon"
    />
    <!-- Font Awesome CDN -->
    <script
      src="https://kit.fontawesome.com/c177988b3a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-gray-50 min-h-screen p-4 md:p-10">
    <main>
      <div class="max-w-6xl mx-auto">
        <h1
          class="text-2xl font-bold text-slate-800 mb-6 text-center md:text-left"
        >
          Job Application Tracker
        </h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
          <div class="bg-white p-6 rounded-lg border-2">
            <p class="text-gray-500 font-medium">Total</p>
            <h2 id="total-count" class="text-3xl font-bold">8</h2>
          </div>
          <div class="bg-white p-6 rounded-lg border-2">
            <p class="text-gray-500 font-medium">Interview</p>
            <h2 id="interview-count" class="text-3xl font-bold text-green-600">
              0
            </h2>
          </div>
          <div class="bg-white p-6 rounded-lg border-2">
            <p class="text-gray-500 font-medium text-red-500">Rejected</p>
            <h2 id="rejected-count" class="text-3xl font-bold text-red-600">
              0
            </h2>
          </div>
        </div>

        <div
          class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4"
        >
          <h3 class="text-xl font-bold">Available Jobs</h3>
          <span class="text-gray-500 font-medium text-lg"
            ><span id="job-tab-count">8</span> Jobs</span
          >
        </div>

        <div class="flex gap-2 mb-8 overflow-x-auto pb-2">
          <button
            onclick="filterJobs('all')"
            id="btn-all"
            class="btn btn-sm bg-blue-600 text-white hover:bg-blue-700"
          >
            All
          </button>
          <button
            onclick="filterJobs('interview')"
            id="btn-interview"
            class="btn btn-sm bg-white border-gray-300"
          >
            Interview
          </button>
          <button
            onclick="filterJobs('rejected')"
            id="btn-rejected"
            class="btn btn-sm bg-white border-gray-300"
          >
            Rejected
          </button>
        </div>

        <div id="job-container" class="grid grid-cols-1 gap-4"></div>

        <div
          id="empty-state"
          class="hidden flex flex-col items-center justify-center py-20 bg-white rounded-xl border border-dashed border-gray-300"
        >
          <img src="image/job.png" class="w-20 mb-4 opacity-30" alt="No jobs" />
          <h2 class="text-xl font-bold text-gray-700">No jobs available</h2>
          <p class="text-gray-500">Check back later for new opportunities</p>
        </div>
      </div>
    </main>

    <script src="Js/job.js"></script>
    <script src="Js/script.js"></script>
  </body>
</html>
